name: 问题反馈
description: 功能用不了、结果不对、页面显示异常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 这是公开仓库，请不要填写手机号、邮箱、验证码、密钥等个人信息，截图请打码。
  - type: textarea
    id: steps
    attributes:
      label: 在哪个页面、做了什么
      placeholder: 例如：在「AI 视频」页选了「口播带货」技能，上传两张商品图后点「立即生成」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望看到什么，实际看到什么
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: 发生时间和任务编号（如果有）
      placeholder: 例如：10 月 11 日 14:20 左右，任务编号 xxxx
  - type: dropdown
    id: device
    attributes:
      label: 设备
      options:
        - 电脑
        - 手机
        - 平板
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: 例如：Chrome、Safari、微信内置浏览器
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 直接拖进来即可，请先给个人信息打码
